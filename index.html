<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Жребий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="loading" id="loading">Загрузка…</div>

  <div class="app" id="app" hidden>
    <div class="frame">
      <div class="picture"><img id="img" alt=""></div>
      <div class="side">
        <div class="panel" id="panel">
          <p class="kicker" id="kicker"></p>
          <div class="text" id="text"></div>
        </div>
        <div class="choices" id="choices"></div>
      </div>
    </div>
  </div>

  <div class="video-layer" id="videoLayer">
    <video id="video" playsinline webkit-playsinline muted preload="auto"></video>
    <button class="play" id="videoPlay" aria-label="Смотреть">▶</button>
    <button class="skip" id="videoSkip">Пропустить</button>
    <div class="plate" id="videoPlate">
      <p id="videoCaption"></p>
      <button id="videoNext">Дальше</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
